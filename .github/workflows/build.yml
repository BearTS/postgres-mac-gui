name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcode-select -p

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Run tests
        run: ./Scripts/test.sh

  build:
    name: Build app and DMG
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          # Scripts/build-app.sh derives the version from git tags and the commit count.
          fetch-depth: 0

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Generate app icon
        run: swift Scripts/make-icon.swift Resources

      - name: Build app
        # Ad-hoc signed: no certificate, no Apple Developer account, no repository secrets.
        run: ./Scripts/build-app.sh release

      - name: Verify bundle
        run: |
          codesign --verify --verbose=2 build/DevServices.app
          plutil -lint build/DevServices.app/Contents/Info.plist
          test -x build/DevServices.app/Contents/MacOS/DevServices
          test -f build/DevServices.app/Contents/Resources/AppIcon.icns

      - name: Create DMG
        run: ./Scripts/make-dmg.sh build/DevServices.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevServices-dmg
          path: build/DevServices.dmg
          if-no-files-found: error

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/DevServices.dmg
          generate_release_notes: true
          body: |
            ## Install

            1. Download `DevServices.dmg` below and open it.
            2. Drag **Dev Services** to Applications.
            3. Right-click it in Applications and choose **Open**, then confirm.

            That last step is needed because this build is ad-hoc signed rather
            than notarised — it is built in public CI with no Apple Developer
            account and no signing secrets. You can also run:

            ```
            xattr -dr com.apple.quarantine "/Applications/DevServices.app"
            ```

            Or build it yourself, which avoids the prompt entirely:

            ```
            git clone https://github.com/${{ github.repository }}.git
            cd postgres-mac-gui && ./install.sh
            ```
